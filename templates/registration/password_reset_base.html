<!doctype html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <script>try { if (!sessionStorage.getItem("stockguard-splash-seen")) document.documentElement.classList.add("show-splash"); } catch (_) { document.documentElement.classList.add("show-splash"); }</script>
  <title>{% block title %}Rejesha nenosiri{% endblock %} · StockGuard</title>
  {% load static %}
  <link rel="manifest" href="{% static 'inventory/manifest.webmanifest' %}">
  <link rel="icon" href="{% static 'inventory/icons/icon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'inventory/css/app.css' %}">
  <script src="{% static 'inventory/js/app.js' %}" defer></script>
</head>
<body class="login-page">
  <div class="splash-screen" data-splash-screen role="status" aria-live="polite" aria-label="Inapakia StockGuard">
    <div class="splash-orb splash-orb-one"></div><div class="splash-orb splash-orb-two"></div>
    <div class="splash-content">
      <div class="splash-logo"><img src="{% static 'inventory/icons/icon.svg' %}" alt=""><span>StockGuard</span></div>
      <p class="splash-tagline">STOCK <span>·</span> SALES <span>·</span> GROWTH</p>
      <div class="splash-loader" aria-hidden="true"><span></span></div>
      <p class="splash-message" data-splash-message>Tunaandaa biashara yako...</p>
      <div class="splash-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </div>
  <main class="login-card">
    <div class="login-topline">
      <a class="brand login-brand" href="{% url 'home' %}"><img class="brand-icon" src="{% static 'inventory/icons/icon.svg' %}" alt="">StockGuard</a>
      <div class="login-options">
        <div class="language-switch" role="group" aria-label="Chagua lugha">
          <button type="button" data-language-option="sw" aria-label="Kiswahili">SW</button>
          <button type="button" data-language-option="en" aria-label="English">EN</button>
        </div>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Badilisha mwonekano">🌙 <span class="theme-label">Mwonekano</span></button>
      </div>
    </div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
